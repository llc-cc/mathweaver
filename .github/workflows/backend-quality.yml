name: Backend quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile storage modules
        run: python -m compileall -q backend/storage backend/scripts
      - name: Run pytest with Fake OSS adapters
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mathweaver
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MATHWEAVER_DATABASE_NAME: mathweaver
      MATHWEAVER_DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/mathweaver?charset=utf8mb4
      MATHWEAVER_OBJECT_STORAGE: local
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Wait for MySQL
        run: |
          python - <<'PY'
          import time
          import pymysql

          for attempt in range(30):
              try:
                  connection = pymysql.connect(
                      host="127.0.0.1",
                      port=3306,
                      user="root",
                      password="ci-root-password",
                      database="mathweaver",
                  )
                  connection.close()
                  break
              except pymysql.MySQLError:
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY
      - name: Apply Alembic migrations
        working-directory: backend
        run: python -m alembic -c migrations/alembic.ini upgrade head
      - name: Generate offline Alembic SQL
        working-directory: backend
        run: python -m alembic -c migrations/alembic.ini upgrade head --sql > ../alembic-upgrade.sql
      - name: Run MySQL integration pytest
        run: python -m pytest backend/tests -m mysql -q

  frontend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm exec -- vitest run
      - name: Generate route types
        run: npx react-router typegen
      - name: Check TypeScript
        run: npx tsc --noEmit

  container-smoke:
    runs-on: ubuntu-latest
    env:
      MATHWEAVER_BACKEND_IMAGE: mathweaver-backend:ci
      MATHWEAVER_FRONTEND_IMAGE: mathweaver-web:ci
      MATHWEAVER_MIGRATION_IMAGE: mathweaver-backend:ci
      MATHWEAVER_HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Create non-secret smoke environment
        run: |
          umask 077
          printf '%s\n' \
            'MATHWEAVER_DATABASE_URL=sqlite:////var/lib/mathweaver/smoke.db' \
            'MATHWEAVER_DATABASE_NAME=mathweaver' \
            'MATHWEAVER_OBJECT_STORAGE=local' \
            > .env.production
      - name: Validate test Compose
        run: docker compose -f deploy/docker-compose.web.yml -f deploy/docker-compose.test.yml config --quiet
      - name: Docker build backend image
        run: docker build --tag mathweaver-backend:ci backend
      - name: Docker build frontend image
        run: docker build --tag mathweaver-web:ci .
      - name: Start test Compose
        run: docker compose -f deploy/docker-compose.web.yml -f deploy/docker-compose.test.yml up --detach
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Print service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.web.yml -f deploy/docker-compose.test.yml logs --no-color
      - name: Stop test Compose
        if: always()
        run: docker compose -f deploy/docker-compose.web.yml -f deploy/docker-compose.test.yml down --volumes --remove-orphans
