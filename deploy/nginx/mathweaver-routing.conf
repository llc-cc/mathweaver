# Keep ordinary requests, synchronous LLM work, and long-running pipeline work
# in separate Gunicorn pools so one workload cannot starve login or data saves.
map "$request_method:$uri" $mathweaver_backend_port {
    default 5002;

    "POST:/api/v2/config/validate" 5003;
    "POST:/api/v2/proof-assist" 5003;
    "~^POST:/api/v2/edu/assignments/[^/]+/proof-assist$" 5003;
    "~^POST:/api/v2/edu/classes/[^/]+/assignments$" 5003;
    "~^POST:/api/v2/edu/assignments/[^/]+/assessments/[^/]+/regenerate$" 5003;
    "~^POST:/api/v2/edu/assignments/[^/]+/assessments/[^/]+/questions/[^/]+/regenerate$" 5003;
    "~^POST:/api/v2/edu/assignments/[^/]+/assessments/regenerate-unresolved$" 5003;
    "~^POST:/api/v2/edu/submissions/[^/]+/evaluate$" 5003;

    "~^(GET|POST|DELETE):/api/v2/jobs(?:/|$)" 5004;
    "~^(GET|POST|DELETE):/api/v2/ocr(?:/|$)" 5004;
    "POST:/api/v2/agent-import" 5004;
    "~^POST:/api/v2/history/[^/]+/resume$" 5004;
    "~^(GET|POST):/api/v2/export/[^/]+/artifacts$" 5004;
}

# An empty key means this limit does not apply to ordinary or pipeline traffic.
map $mathweaver_backend_port $mathweaver_ai_pool_key {
    default "";
    5003 "mathweaver-ai-pool";
}

limit_conn_zone $mathweaver_ai_pool_key zone=mathweaver_ai_pool_connections:64k;
