# Shared rate and connection limits for the teaching deployment. This file also
# keeps the legacy diagnostic listener bound to loopback only.
map $http_authorization $mathweaver_actor_key {
    default $binary_remote_addr;
    "~^Bearer[[:space:]]+[A-Za-z0-9_-]{20,128}$" $http_authorization;
}

# Login/register have dedicated campus-NAT-friendly buckets. Ordinary API calls
# are isolated by bearer token whenever one is present.
map "$request_method:$uri" $mathweaver_api_client_key {
    default $mathweaver_actor_key;
    "POST:/api/v2/auth/login" "";
    "POST:/api/v2/auth/register" "";
    "GET:/api/v2/ping" "";
    "HEAD:/api/v2/ping" "";
    "GET:/api/v2/ready" "";
    "HEAD:/api/v2/ready" "";
}

map "$request_method:$uri" $mathweaver_api_global_key {
    default "mathweaver-api";
    "POST:/api/v2/auth/login" "";
    "POST:/api/v2/auth/register" "";
    "GET:/api/v2/ping" "";
    "HEAD:/api/v2/ping" "";
    "GET:/api/v2/ready" "";
    "HEAD:/api/v2/ready" "";
}

map "$request_method:$uri" $mathweaver_auth_ip_key {
    default "";
    "POST:/api/v2/auth/login" $binary_remote_addr;
    "POST:/api/v2/auth/register" $binary_remote_addr;
}

map $mathweaver_auth_ip_key $mathweaver_auth_global_key {
    "" "";
    default "mathweaver-auth";
}

map "$request_method:$uri" $mathweaver_graph_global_key {
    default "";
    "POST:/api/v2/jobs" "mathweaver-graph";
    "~^POST:/api/v2/history/[^/]+/resume$" "mathweaver-graph";
    "~^POST:/api/v2/jobs/[^/]+/resume$" "mathweaver-graph";
}

map $mathweaver_graph_global_key $mathweaver_graph_client_key {
    "" "";
    default $mathweaver_actor_key;
}

map "$request_method:$uri" $mathweaver_heavy_global_key {
    default "";
    "POST:/api/v2/ocr/jobs" "mathweaver-heavy";
    "POST:/api/v2/agent-import" "mathweaver-heavy";
    "POST:/api/v2/proof-import-ocr" "mathweaver-heavy";
    "POST:/api/v2/ocr/runtime/install" "mathweaver-heavy";
    "~^POST:/api/v2/ocr/jobs/[^/]+/retry$" "mathweaver-heavy";
    "~^POST:/api/v2/export/[^/]+/artifacts$" "mathweaver-heavy";
    "~^POST:/api/v2/edu/classes/[^/]+/snapshots$" "mathweaver-heavy";
}

map $mathweaver_heavy_global_key $mathweaver_heavy_client_key {
    "" "";
    default $mathweaver_actor_key;
}

map "$request_method:$uri" $mathweaver_student_ai_global_key {
    default "";
    "POST:/api/v2/proof-assist" "mathweaver-student-ai";
    "~^POST:/api/v2/edu/assignments/[^/]+/proof-assist$" "mathweaver-student-ai";
}

map $mathweaver_student_ai_global_key $mathweaver_student_ai_client_key {
    "" "";
    default $mathweaver_actor_key;
}

map "$request_method:$uri" $mathweaver_teacher_ai_global_key {
    default "";
    "POST:/api/v2/config/validate" "mathweaver-teacher-ai";
    "~^POST:/api/v2/edu/classes/[^/]+/assignments$" "mathweaver-teacher-ai";
    "~^POST:/api/v2/edu/assignments/[^/]+/assessments/[^/]+/regenerate$" "mathweaver-teacher-ai";
    "~^POST:/api/v2/edu/assignments/[^/]+/assessments/[^/]+/questions/[^/]+/regenerate$" "mathweaver-teacher-ai";
    "~^POST:/api/v2/edu/assignments/[^/]+/assessments/regenerate-unresolved$" "mathweaver-teacher-ai";
    "~^POST:/api/v2/edu/submissions/[^/]+/evaluate$" "mathweaver-teacher-ai";
}

map $mathweaver_teacher_ai_global_key $mathweaver_teacher_ai_client_key {
    "" "";
    default $mathweaver_actor_key;
}

map "$request_method:$uri" $mathweaver_assignment_create_key {
    default "";
    "~^POST:/api/v2/edu/classes/[^/]+/assignments$" "mathweaver-assignment-create";
}

map "$request_method:$uri" $mathweaver_upload_global_key {
    default "";
    "POST:/api/v2/jobs" "mathweaver-upload";
    "POST:/api/v2/agent-import" "mathweaver-upload";
    "POST:/api/v2/ocr/uploads" "mathweaver-upload";
    "~^POST:/api/v2/edu/classes/[^/]+/snapshots$" "mathweaver-upload";
}

map $mathweaver_upload_global_key $mathweaver_upload_client_key {
    "" "";
    default $mathweaver_actor_key;
}

# The expected 150-person login wave produces roughly 600-750 follow-up reads.
# Login is paced at 30/s; ordinary reads drain at 80/s with headroom for retries
# and refreshes, without making expensive jobs less protected.
limit_req_zone $mathweaver_api_client_key   zone=mathweaver_api_client:2m   rate=15r/s;
limit_req_zone $mathweaver_api_global_key   zone=mathweaver_api_global:1m   rate=80r/s;
limit_req_zone $mathweaver_auth_ip_key      zone=mathweaver_auth_ip:1m      rate=20r/s;
limit_req_zone $mathweaver_auth_global_key  zone=mathweaver_auth_global:1m  rate=30r/s;
limit_req_zone $mathweaver_graph_global_key zone=mathweaver_graph_global:1m rate=2r/m;
limit_req_zone $mathweaver_graph_client_key zone=mathweaver_graph_client:1m rate=1r/m;
limit_req_zone $mathweaver_heavy_global_key zone=mathweaver_heavy_global:1m rate=6r/m;
limit_req_zone $mathweaver_heavy_client_key zone=mathweaver_heavy_client:1m rate=2r/m;
limit_req_zone $binary_remote_addr          zone=mathweaver_probe:64k       rate=1r/s;

limit_conn_zone $server_name                         zone=mathweaver_server_connections:1m;
limit_conn_zone $mathweaver_api_global_key           zone=mathweaver_api_connections:1m;
limit_conn_zone $mathweaver_api_client_key           zone=mathweaver_client_connections:2m;
limit_conn_zone $mathweaver_graph_global_key         zone=mathweaver_graph_connections:1m;
limit_conn_zone $mathweaver_graph_client_key         zone=mathweaver_graph_client_connections:1m;
limit_conn_zone $mathweaver_student_ai_global_key    zone=mathweaver_student_ai_connections:1m;
limit_conn_zone $mathweaver_student_ai_client_key    zone=mathweaver_student_ai_client_connections:1m;
limit_conn_zone $mathweaver_teacher_ai_global_key    zone=mathweaver_teacher_ai_connections:1m;
limit_conn_zone $mathweaver_teacher_ai_client_key    zone=mathweaver_teacher_ai_client_connections:1m;
limit_conn_zone $mathweaver_assignment_create_key    zone=mathweaver_assignment_create_connections:64k;
limit_conn_zone $mathweaver_upload_global_key        zone=mathweaver_upload_connections:1m;
limit_conn_zone $mathweaver_upload_client_key        zone=mathweaver_upload_client_connections:1m;

server {
    listen 127.0.0.1:18080;
    server_name _;

    client_max_body_size 120m;
    proxy_connect_timeout 3s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    limit_conn mathweaver_server_connections 1500;
    error_page 429 = @mathweaver_429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /__mathweaver_limit_probe {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        access_log off;
        limit_req zone=mathweaver_probe burst=1 nodelay;
        empty_gif;
    }

    location /api/ {
        limit_req zone=mathweaver_auth_ip burst=650 delay=20;
        limit_req zone=mathweaver_auth_global burst=650 delay=30;
        limit_req zone=mathweaver_api_client burst=45 nodelay;
        limit_req zone=mathweaver_api_global burst=1000 delay=120;
        limit_req zone=mathweaver_graph_global burst=1 nodelay;
        limit_req zone=mathweaver_graph_client;
        limit_req zone=mathweaver_heavy_global burst=2 nodelay;
        limit_req zone=mathweaver_heavy_client burst=1 nodelay;

        limit_conn mathweaver_server_connections 1500;
        limit_conn mathweaver_api_connections 900;
        limit_conn mathweaver_client_connections 12;
        limit_conn mathweaver_graph_connections 2;
        limit_conn mathweaver_graph_client_connections 1;
        limit_conn mathweaver_student_ai_connections 6;
        limit_conn mathweaver_student_ai_client_connections 1;
        limit_conn mathweaver_teacher_ai_connections 2;
        limit_conn mathweaver_teacher_ai_client_connections 1;
        limit_conn mathweaver_ai_pool_connections 6;
        limit_conn mathweaver_auth_pool_connections 32;
        limit_conn mathweaver_assignment_create_connections 2;
        limit_conn mathweaver_upload_connections 3;
        limit_conn mathweaver_upload_client_connections 1;

        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 128k;
        proxy_next_upstream off;
        proxy_pass http://127.0.0.1:$mathweaver_backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @mathweaver_429 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 429 '{"error":"too_many_requests","message":"Request rate is too high; retry shortly"}';
    }
}
