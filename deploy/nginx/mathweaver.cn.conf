server {
    server_name mathweaver.cn www.mathweaver.cn;

    client_max_body_size 120m;
    proxy_connect_timeout 3s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    limit_conn mathweaver_server_connections 1500;
    error_page 429 = @mathweaver_429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=mathweaver_auth_ip burst=650 delay=20;
        limit_req zone=mathweaver_auth_global burst=650 delay=30;
        limit_req zone=mathweaver_api_client burst=45 nodelay;
        limit_req zone=mathweaver_api_global burst=1000 delay=120;
        limit_req zone=mathweaver_graph_global burst=1 nodelay;
        limit_req zone=mathweaver_graph_client;
        limit_req zone=mathweaver_heavy_global burst=2 nodelay;
        limit_req zone=mathweaver_heavy_client burst=1 nodelay;

        limit_conn mathweaver_server_connections 1500;
        limit_conn mathweaver_api_connections 900;
        limit_conn mathweaver_client_connections 12;
        limit_conn mathweaver_graph_connections 2;
        limit_conn mathweaver_graph_client_connections 1;
        limit_conn mathweaver_student_ai_connections 6;
        limit_conn mathweaver_student_ai_client_connections 1;
        limit_conn mathweaver_teacher_ai_connections 2;
        limit_conn mathweaver_teacher_ai_client_connections 1;
        limit_conn mathweaver_ai_pool_connections 6;
        limit_conn mathweaver_auth_pool_connections 32;
        limit_conn mathweaver_assignment_create_connections 2;
        limit_conn mathweaver_upload_connections 3;
        limit_conn mathweaver_upload_client_connections 1;

        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 128k;
        proxy_next_upstream off;
        proxy_pass http://127.0.0.1:$mathweaver_backend_port;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite assets are immutable and content-hashed. Serving them directly avoids
    # making the Node SSR process handle thousands of duplicate static requests.
    location ^~ /assets/ {
        root /opt/mathweaver/current-teaching/build/client;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /teaching-usage-stats.png {
        root /opt/mathweaver/current-teaching/build/client;
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @mathweaver_429 {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 429 '{"error":"too_many_requests","message":"Request rate is too high; retry shortly"}';
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mathweaver.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathweaver.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.mathweaver.cn) {
        return 301 https://$host$request_uri;
    }

    if ($host = mathweaver.cn) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name mathweaver.cn www.mathweaver.cn;
    return 404;
}
