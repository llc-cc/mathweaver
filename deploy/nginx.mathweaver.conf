map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $http_x_forwarded_proto $mathweaver_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $request_uri $mathweaver_cache_control {
    default "";
    ~^/api/v2(?:/|$) "no-store";
    /health "no-store";
}

upstream mathweaver_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream mathweaver_backend {
    server backend:5001;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 110m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $mathweaver_cache_control always;

    location = /health {
        proxy_pass http://mathweaver_backend/api/v2/ping;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mathweaver_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location ^~ /api/v2/ {
        proxy_pass http://mathweaver_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mathweaver_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://mathweaver_frontend;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mathweaver_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

